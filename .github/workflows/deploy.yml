# ROCNI REZERVNI deploy na Vercel (samo workflow_dispatch).
#
# ARHITEKTURA (P35, 2026-10-11): Vercel projekt je zdaj povezan z GitHub App
# (Settings -> Git -> robertpezdirc12-design/muzej, productionBranch=main),
# zato se ob vsakem pushu na main produkcija samodejno gradi na strani Vercel
# (brez žetona VERCEL_TOKEN v tej poti — neodvisno od poteka žetona).
# Ta delovni tok NE sme več teči ob pushu, ker bi povzročil DVOJEN deploy
# (na Hobby načrtu 1 sočasna gradnja -> čakanje v vrsti, glej P19).
#
# Namen zdaj: rocni backup-deploy (Actions zavihek -> Run workflow), ce bi
# git integracija odpovedala, in testni deploy ob rotaciji žetona.
#
# Skrivnosti (Actions Secrets): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Namig: po izteku zetona VERCEL_TOKEN (Hobby zetoni potecejo) ga obnovi
# na vercel.com/tokens in posodobi skrivnost v repozitoriju.
name: Deploy na Vercel (rocni rezervni)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 30 min namesto 15: na Hobby načrtu je 1 sočasna gradnja na ekipo,
    # zato lahko naš deploy čaka v vrsti za drugim projektom (P19: točno to
    # se je zgodilo — 14 min čakanja na BLOCKED, potem timeout)
    timeout-minutes: 30
    steps:
      - name: Pridobi kodo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Namesti Vercel CLI
        run: npm install -g vercel@63

      - name: Deploy v produkcijo
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

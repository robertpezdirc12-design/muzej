# Probe: find out which keyword prevents job creation
# (temporary bisect version)

stages:
  - probe

probe-a-minimal:
  stage: probe
  script:
    - echo "A minimal"

probe-b-image:
  stage: probe
  image: node:22
  script:
    - echo "B image"

probe-c-rules:
  stage: probe
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - echo "C rules"

probe-d-full:
  stage: probe
  image: node:22
  interruptible: true
  resource_group: probe-rg
  environment:
    name: production
    url: https://griblje-museum.vercel.app
  script:
    - echo "D full no retry"
